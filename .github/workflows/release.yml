name: Release on tag

on:
  push:
    tags:
      - v*

# Declare default permissions as read only.
permissions: read-all

jobs:
  release_github:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Building relies on the Android Gradle plugin,
      # which requires a modern Java version (not the default one).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter packages
        run: |
          chmod +x flutterw scripts/*.sh
          ./flutterw doctor -v
          ./flutterw pub get

      # cf https://github.com/deckerst/aves/issues/1521#issuecomment-5229015364
      - name: Remove build ID from native lib
        run: |
          PUB_CACHE=$HOME/.pub-cache
          echo "PUB_CACHE=$PUB_CACHE"
          echo "Edit native lib build scripts from pub-cache hosted packages:"
          ls ${PUB_CACHE}/hosted/*
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt 2>/dev/null || true

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build signed libre artifacts
        # specify NDK for `icu4x` hook linker
        # cf https://github.com/deckerst/aves/issues/1521#issuecomment-5599985874
        #
        # `KEY_JKS` should contain the result of:
        # gpg -c --armor keystore.jks
        # `KEY_JKS_PASSPHRASE` should contain the passphrase used for the command above
        run: |
          set -euo pipefail
          echo "Default Android NDK environment paths:"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          NDK_VERSION=28.2.13676358
          echo "Set Android NDK to version $NDK_VERSION:"
          ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          ANDROID_NDK_HOME=$ANDROID_NDK
          ANDROID_NDK_ROOT=$ANDROID_NDK
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          printf '%s' "${{ secrets.KEY_JKS }}" > release.keystore.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.KEY_JKS_PASSPHRASE }}" --decrypt release.keystore.asc > "$AVES_STORE_FILE"
          rm release.keystore.asc
          mkdir outputs
          export AVES_GOOGLE_API_KEY="NONE"
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi
          cp build/app/outputs/flutter-apk/*-libre-release.apk outputs
          sha256sum outputs/*.apk > outputs/SHA256SUMS
          rm "$AVES_STORE_FILE"
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          AVES_KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          AVES_KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}
          AVES_GOOGLE_API_KEY: ${{ secrets.AVES_GOOGLE_API_KEY }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'outputs/*'

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "outputs/*"
          allowUpdates: true
          removeArtifacts: true
          name: "MediaCraft ${{ github.ref_name }}"
          body: |
            [Changelog](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md#${{ github.ref_name }})

            This release contains signed libre APK artifacts. Play flavor and store upload remain pending Google Cloud/Firebase and Play service-account configuration.
          token: ${{ secrets.GITHUB_TOKEN }}
