name: Release on tag

on:
  push:
    tags:
      - v*

# Declare default permissions as read only.
permissions: read-all

jobs:
  release_github:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Building relies on the Android Gradle plugin,
      # which requires a modern Java version (not the default one).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter packages
        run: |
          chmod +x flutterw scripts/*.sh
          ./flutterw doctor -v

      - name: Verify tag version
        id: version
        run: |
          set -euo pipefail
          package_version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          package_version=${package_version%%+*}
          release_tag=${GITHUB_REF_NAME%-baidu}
          test "$release_tag" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${package_version}." >&2
            exit 1
          }
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Configure Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          printf 'y\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Run libre quality checks
        run: scripts/quality_flavor.sh libre

      - name: Run Baidu quality checks
        run: scripts/quality_flavor.sh baidu

      - name: Restore release flavor
        run: scripts/apply_flavor_baidu.sh

      # cf https://github.com/deckerst/aves/issues/1521#issuecomment-5229015364
      - name: Remove build ID from native lib
        run: |
          set -euo pipefail
          PUB_CACHE=$HOME/.pub-cache
          echo "PUB_CACHE=$PUB_CACHE"
          echo "Edit native lib build scripts from pub-cache hosted packages:"
          mapfile -t cmake_files < <(find "$PUB_CACHE/hosted" -path '*/jni-*/src/CMakeLists.txt' -type f)
          test "${#cmake_files[@]}" -gt 0 || {
            echo "No jni package CMakeLists.txt found in the pub cache." >&2
            exit 1
          }
          mapfile -t patch_files < <(grep -l -- '-Wl,' "${cmake_files[@]}")
          test "${#patch_files[@]}" -gt 0 || {
            echo "No native linker flags matched the required build-ID patch." >&2
            exit 1
          }
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "${patch_files[@]}"
          grep -q -- '--build-id=none' "${patch_files[@]}"

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build signed Baidu artifacts
        # specify NDK for `icu4x` hook linker
        # cf https://github.com/deckerst/aves/issues/1521#issuecomment-5599985874
        #
        # `KEY_JKS` should contain the result of:
        # gpg -c --armor keystore.jks
        # `KEY_JKS_PASSPHRASE` should contain the passphrase used for the command above
        run: |
          set -euo pipefail
          if [ -z "$MEDIACRAFT_BAIDU_API_KEY" ] || [ "$MEDIACRAFT_BAIDU_API_KEY" = NONE ]; then
            echo "MEDIACRAFT_BAIDU_API_KEY must be configured for Baidu releases." >&2
            exit 1
          fi
          echo "Default Android NDK environment paths:"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "Use the NDK configured before quality checks:"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          printf '%s' "${{ secrets.KEY_JKS }}" > release.keystore.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.KEY_JKS_PASSPHRASE }}" --decrypt release.keystore.asc > "$AVES_STORE_FILE"
          rm release.keystore.asc
          mkdir outputs
          export AVES_GOOGLE_API_KEY="NONE"
          ./flutterw build apk --no-pub --release -t lib/main_baidu.dart --flavor baidu --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-baidu-release.apk" "outputs/MediaCraft-${RELEASE_VERSION}-baidu-${abi}-release.apk"
          done
          (cd outputs && sha256sum *.apk > SHA256SUMS.txt)
          rm "$AVES_STORE_FILE"
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          AVES_KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          AVES_KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}
          AVES_GOOGLE_API_KEY: ${{ secrets.AVES_GOOGLE_API_KEY }}
          MEDIACRAFT_BAIDU_API_KEY: ${{ secrets.MEDIACRAFT_BAIDU_API_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.package_version }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'outputs/*'

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "outputs/*"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          name: "MediaCraft v${{ steps.version.outputs.package_version }} 百度版"
          body: |
            [Changelog](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md#v${{ steps.version.outputs.package_version }})

            本次 GitHub Release 提供百度版签名 APK，包名为 `com.mediacraft.app.baidu`，包含 arm64-v8a、armeabi-v7a 和 x86_64 安装包及 SHA256SUMS.txt。正式发布后设为 Latest，供应用内检查更新使用。
          token: ${{ secrets.GITHUB_TOKEN }}
