org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true

# --warning-mode=(all,fail,none,summary)
org.gradle.warning.mode=summary
ksp.incremental.log=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Pub cache and project sources may reside on different Windows drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# cf https://developer.android.com/topic/performance/app-optimization/full-mode
android.enableR8.fullMode=true

# optimized resource shrinking pipeline (enabled by default with AGP >= 9.0.0)
android.r8.optimizedResourceShrinking=true

# enable parallelization
org.gradle.parallel=false
org.gradle.workers.max=1

# most tasks are incompatible with configuration cache as of Gradle v8.14.4
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true

# cf https://github.com/flutter/flutter/issues/180137
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
